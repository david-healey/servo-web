events {}

http {
  server {
    listen 80;

    # Webpage visible externally (through Cloudflare)
    location / {
      proxy_pass http://webpage:8080;
      proxy_set_header Host $host;
    }

    # Servo: accessible via webpage (and Cloudflare Access)
    location /servo/ {
      proxy_pass http://servo:8081;
      proxy_set_header Host $host;
    }

    # Webcam stream (still internal, but can be embedded in webpage)
    location /webcam {
      rewrite ^/webcam(/.*)$ $1 break;
      proxy_pass http://webcam:8082/;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
